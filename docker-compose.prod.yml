# Production stack — anonymity-first, no public origin IP.
#
# Target hardware: Parkinhost Russia Dedicated (~€110/mo)
#   Xeon E3 / 16 GB RAM / 2×16 TB HDD / 1 Gbps / Moscow
#
# Media: Self-hosted MinIO on the SAME server (most anonymous + crypto-payable)
# Edge:  DDoS-Guard Website Protection → nginx → app
# Tor:   optional .onion path
#
# Usage:
#   cp .env.example .env.prod   # fill real strong passwords
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# MinIO data on the big HDD (example — adjust device/path on the dedicated):
#   volumes:
#     - /data/minio:/data

services:
  edge:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      # Only the edge is public. Point DDoS-Guard here; firewall the host so
      # ONLY DDoS-Guard IP ranges can reach these ports (see docs/DEPLOY.md).
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    networks:
      - edge-net

  app:
    image: ${IMAGE:-lumengallery:latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      # Internal Docker MariaDB usually has no TLS — default false unless you set certs.
      DB_SSL: ${DB_SSL:-false}
      DB_SSL_CA: ${DB_SSL_CA:-}
      REDIS_URL: redis://redis:6379
      ELASTICSEARCH_URL: http://elasticsearch:9200
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-lumengallery-media}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_FORCE_PATH_STYLE: "true"
      CDN_HOSTNAME: ${CDN_HOSTNAME:-}
      CDN_URL: ${CDN_URL:-}
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - edge-net
      - internal-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  tor:
    image: dperson/torproxy:latest
    restart: unless-stopped
    environment:
      TOR_HIDDEN_SERVICE: "true"
    command: >
      -s "80:app:3000"
    volumes:
      - tor-data:/var/lib/tor
    depends_on:
      app:
        condition: service_healthy
    networks:
      - edge-net

  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME:-lumengallery}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    command:
      - --innodb-encrypt-tables=ON
      - --innodb-encrypt-log=ON
      - --skip-name-resolve
      - --general-log=0
    # Host-side bot access (localhost only — never expose publicly)
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - internal-net

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks:
      - internal-net

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    # Localhost only: host bot (MegaBot) can upload without joining Docker network.
    # NEVER bind 0.0.0.0 — firewall + 127.0.0.1 only.
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      # Prefer bind-mount to the large HDD, e.g. /data/minio:/data
      - minio-data:/data
    networks:
      - internal-net

networks:
  edge-net:
    driver: bridge
  internal-net:
    driver: bridge
    internal: true

volumes:
  mariadb-data:
  es-data:
  minio-data:
  tor-data:
