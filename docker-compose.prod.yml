# Production stack — anonymity-first, no public origin IP.
#
# Target hardware: Abelohost Storage Pro (~€39.99/mo)
#   4 GB RAM / 2 CPU / 200 GB SAS / unmetered / dedicated IPv4 (NL)
#
# Media: Backblaze B2 (S3-compatible). No local MinIO in prod.
# Edge:  DDoS-Guard (or any no-log anti-DDoS) → nginx → app
# Tor:   optional .onion path
#
# Two ways in, both hiding the origin:
#   1) Clearnet: DDoS-Guard -> edge (nginx) -> app   (public domain)
#   2) Tor:      .onion hidden service -> app         (no IP at all)
#
# The data stores (mariadb/redis/elasticsearch) live on an INTERNAL
# docker network with NO published ports — reachable only by the app.
# Nothing here writes visitor logs (see nginx.conf: access_log off).
#
# Usage:
#   cp .env.example .env.prod   # fill real values (especially B2 keys)
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d

services:
  edge:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      # Only the edge is public. Point DDoS-Guard here; firewall the host so
      # ONLY DDoS-Guard IP ranges can reach these ports (see docs/DEPLOY.md).
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    networks:
      - edge-net

  app:
    image: ${IMAGE:-lumengallery:latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      DB_SSL: "true"
      DB_SSL_CA: ${DB_SSL_CA}
      REDIS_URL: redis://redis:6379
      ELASTICSEARCH_URL: http://elasticsearch:9200
      # Backblaze B2 (external S3-compatible)
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-lumengallery-media}
      S3_REGION: ${S3_REGION}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      CDN_HOSTNAME: ${CDN_HOSTNAME}
      CDN_URL: ${CDN_URL}
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - edge-net      # reachable by edge + tor
      - internal-net  # reachable to data stores
    # No published ports: the app is never directly public.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  tor:
    image: dperson/torproxy:latest
    restart: unless-stopped
    # Publishes a v3 .onion hidden service that forwards to the app.
    # The onion hostname appears in ./infra/tor/data/hidden_service/hostname
    # after first start. Back up that folder to keep the same .onion.
    environment:
      # 80 on the onion -> app:3000
      TOR_HIDDEN_SERVICE: "true"
    command: >
      -s "80:app:3000"
    volumes:
      - tor-data:/var/lib/tor
    depends_on:
      app:
        condition: service_healthy
    networks:
      - edge-net

  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME:-lumengallery}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    command:
      - --innodb-encrypt-tables=ON
      - --innodb-encrypt-log=ON
      - --skip-name-resolve   # don't do reverse DNS on clients
      - --general-log=0       # never log queries
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]  # no persistence
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - internal-net

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"   # lower footprint for 4GB VPS
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks:
      - internal-net

  # NOTE: No MinIO service in production.
  # Media lives on Backblaze B2 (private bucket + signed URLs / CDN).
  # Local MinIO is only used in docker-compose.yml for development.

networks:
  edge-net:
    driver: bridge
  internal-net:
    driver: bridge
    internal: true   # this network has NO route to the internet at all

volumes:
  mariadb-data:
  es-data:
  tor-data:
