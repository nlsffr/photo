include /etc/nginx/generated/removed-media-maps.conf;

server {
    listen 80;
    listen [::]:80;
    server_name _;
    client_max_body_size 50m;

    location /media/ {
        if ($media_tombstoned = 1) { return 410; }
        rewrite ^/media/(.*)$ /fanhub-media/$1 break;
        proxy_pass http://r2-proxy:8080;
        proxy_http_version 1.1;
        proxy_set_header Host 5761668f00b3635454853cb49d398024.r2.cloudflarestorage.com;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_set_header Range $http_range;
        proxy_force_ranges on;
        add_header Cache-Control $media_cache_control always;
        add_header X-Robots-Tag $media_robots_tag always;
    }

    location / {
        proxy_pass http://photo-app-1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    client_max_body_size 50m;

    location /media/ {
        if ($media_tombstoned = 1) { return 410; }
        rewrite ^/media/(.*)$ /fanhub-media/$1 break;
        proxy_pass http://r2-proxy:8080;
        proxy_http_version 1.1;
        proxy_set_header Host 5761668f00b3635454853cb49d398024.r2.cloudflarestorage.com;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_set_header Range $http_range;
        proxy_force_ranges on;
        add_header Cache-Control $media_cache_control always;
        add_header X-Robots-Tag $media_robots_tag always;
    }

    location / {
        proxy_pass http://photo-app-1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
