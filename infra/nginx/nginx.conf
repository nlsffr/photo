# Edge proxy for LumenGallery — hardened for anonymity + DDoS resistance.
# Sits between DDoS-Guard and the Node.js origin. See docs/DEPLOY.md.
#
# Key privacy stance: WE DO NOT LOG. No access log, no IP retention. The
# error log keeps only critical events (no client data). This means there is
# no on-disk record tying a visitor to a request.

user nginx;
worker_processes auto;
pid /run/nginx.pid;

events {
  worker_connections 4096;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # ---- No logging of visitors ----
  access_log off;
  error_log  /var/log/nginx/error.log crit;

  # ---- Hide identity / version ----
  server_tokens off;

  # ---- Sane transport defaults ----
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 20s;
  client_max_body_size 50m;
  types_hash_max_size 2048;

  # ---- Rate limiting (anti-DDoS / anti-scrape) ----
  limit_req_zone $binary_remote_addr zone=perip:10m rate=20r/s;
  limit_conn_zone $binary_remote_addr zone=connperip:10m;

  upstream lumen_origin {
    server app:3000;
    keepalive 32;
  }

  # MinIO (must share a docker network with edge)
  upstream minio_origin {
    server minio:9000;
    keepalive 16;
  }

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;
  ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:10m;
  ssl_session_tickets off;

  server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    limit_req zone=perip burst=40 nodelay;
    limit_conn connperip 20;

    # Public media from MinIO bucket (bot uploads keys under creators/...)
    location /media/ {
      proxy_pass http://minio_origin/lumengallery-media/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Connection "";
      proxy_hide_header X-Powered-By;
      proxy_read_timeout 60s;
      # Cache lightly at edge for thumbs
      proxy_cache_bypass 1;
      add_header Cache-Control "public, max-age=86400" always;
    }

    location / {
      proxy_pass http://lumen_origin;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Connection "";
      proxy_hide_header X-Powered-By;
      proxy_read_timeout 30s;
    }

    location = /api/healthz { proxy_pass http://lumen_origin; }
    location = /api/readyz  { proxy_pass http://lumen_origin; }
  }

  server {
    listen 80;
    server_name _;

    # Allow media over HTTP too (self-signed HTTPS is painful during setup)
    location /media/ {
      proxy_pass http://minio_origin/lumengallery-media/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Connection "";
      proxy_read_timeout 60s;
      add_header Cache-Control "public, max-age=86400" always;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }
}
