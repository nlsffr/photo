# HTTP context only. This second log leaves the existing main log unchanged.
# The marker contains no address, path, agent, referrer or cookie value.
map $sent_http_content_type $maison_page_kind {
    default none;
    "~*^text/html(?:;|$)" document;
    "~*^text/x-component(?:;|$)" flight;
}
map "$maison_page_kind:$http_rsc" $maison_page_class {
    default none;
    "document:" document;
    "flight:1" flight;
}
map $uri $maison_page_excluded_path {
    default 0;
    ~*^/(?:api|_next|media|sitemaps|admin)(?:/|$) 1;
    ~*^/(?:favicon[.](?:ico|svg)|robots[.]txt|sitemap[.]xml|icon|apple-icon)(?:/|$) 1;
    ~*[.](?:css|js|mjs|map|json|xml|txt|png|jpe?g|gif|webp|avif|svg|ico|mp4|webm|mov|m4v|woff2?|ttf|pdf|zip)$ 1;
}
map "$http_purpose|$http_sec_purpose" $maison_page_prefetch {
    default 0;
    ~*(?:prefetch|prerender) 1;
}
map "$http_next_router_prefetch$http_next_router_segment_prefetch$http_next_action$http_next_hmr_refresh" $maison_page_next_internal {
    "" 0;
    default 1;
}
map $http_user_agent $maison_page_declared_robot {
    default 0;
    ~*(?:bot|crawl|spider|slurp|bingpreview|facebookexternalhit|headless|lighthouse|qualitymonitor|healthcheck|curl|wget|python-requests|python-urllib|go-http-client|undici|pagespeed|preview) 1;
    ~*^node(?:[.]js)?(?:/|$) 1;
}
map "$request_method:$status:$maison_page_class:$maison_page_excluded_path:$maison_page_prefetch:$maison_page_next_internal:$maison_page_declared_robot" $maison_log_page {
    default 0;
    "GET:200:document:0:0:0:0" 1;
    "GET:200:flight:0:0:0:0" 1;
}
log_format maison_page_v1 'MAISON_PAGE_V1 $msec $maison_page_class';
access_log /dev/stdout maison_page_v1 if=$maison_log_page;
