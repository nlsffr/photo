name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-typecheck-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm lint
      - run: pnpm build

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-typecheck-build
    steps:
      - uses: actions/checkout@v4

      # Build-only: verifies the image builds and passes its healthcheck.
      # Pushing to the private Harbor registry happens from a separate,
      # manually-triggered deploy workflow that runs over the VPN-only
      # runner — never from a public runner, and the registry itself is
      # never exposed to the public internet. See docs/DEPLOY.md.
      - name: Build image (no push)
        run: docker build -t lumengallery:ci -f Dockerfile .

      - name: Smoke test container
        run: |
          docker run -d --name lumen-ci -p 3000:3000 lumengallery:ci
          for i in $(seq 1 15); do
            if curl -sf http://localhost:3000/api/healthz; then
              echo "healthy"; exit 0
            fi
            sleep 2
          done
          echo "container failed healthcheck"
          docker logs lumen-ci
          exit 1
